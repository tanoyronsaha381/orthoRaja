spring.application.name=orthoraja-api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:9898}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/orthoraja}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DIRECT_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/orthoraja}}
spring.flyway.user=${DATABASE_USERNAME:postgres}
spring.flyway.password=${DATABASE_PASSWORD:postgres}

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-production-secret-value}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://orthoraja.com}
app.google.place-id=${GOOGLE_PLACE_ID:}
app.google.places-api-key=${GOOGLE_PLACES_API_KEY:}
app.google.read-all-reviews-url=${GOOGLE_READ_ALL_REVIEWS_URL:}
app.google.write-review-url=${GOOGLE_WRITE_REVIEW_URL:}
